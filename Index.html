          Untuk membuat pencatatan bulanan yang rapi dan terstruktur di Google Apps Script & Google Sheets, Anda memerlukan dua penyesuaian utama:

1. **Perbaikan Struktur Spreadsheet (Backend)**: Menambahkan kolom **Bulan-Tahun** (misal: `2026-10`) di sheet transaksi agar data dapat dikelompokkan (group by) per bulan secara otomatis.
2. **Perbaikan Tampilan / Dashboard (Frontend HTML)**: Menambahkan dropdown filter **Pilih Bulan** di bagian atas dashboard untuk menampilkan grafik (Pemasukan vs Pengeluaran per bulan) dan riwayat transaksi sesuai bulan yang dipilih.

---

### 1. Update File Backend `Kode.gs` (Google Apps Script)

Ganti seluruh isi file `Kode.gs` Anda dengan kode berikut. Kode ini secara otomatis menambahkan parameter filter bulan dan mendukung grafik data bulanan.

```javascript
function doGet(e) {
  return HtmlService.createTemplateFromFile('Index')
    .evaluate()
    .setTitle('Keuangan Rumah Tangga Bulanan')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var action = data.action;
    var payload = data.payload || {};
    var result = {};

    if (action === 'getDashboardData') {
      result = getDashboardData(payload.bulanTahun);
    } else if (action === 'simpanTransaksi') {
      result = simpanTransaksi(payload);
    } else if (action === 'simpanLimitHarian') {
      result = simpanLimitHarian(payload.limitBaru);
    } else if (action === 'hapusTransaksi') {
      result = hapusTransaksi(payload.rowIndex);
    } else if (action === 'getDaftarBulan') {
      result = getDaftarBulan();
    } else {
      result = { success: false, message: 'Aksi tidak dikenal.' };
    }

    return ContentService.createTextOutput(JSON.stringify(result))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ success: false, message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function getSheetTransaksi() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Transaksi');
  if (!sheet) {
    sheet = ss.insertSheet('Transaksi');
    sheet.appendRow(['ID', 'Tanggal', 'Bulan_Tahun', 'Tipe', 'Keterangan', 'Jumlah']);
  }
  return sheet;
}

function getSheetConfig() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Config');
  if (!sheet) {
    sheet = ss.insertSheet('Config');
    sheet.appendRow(['Key', 'Value']);
    sheet.appendRow(['LimitHarian', '150000']);
  }
  return sheet;
}

function simpanLimitHarian(limitBaru) {
  var sheet = getSheetConfig();
  sheet.getRange('B2').setValue(limitBaru);
  return { success: true, message: 'Limit harian berhasil diperbarui!' };
}

function getLimitHarian() {
  var sheet = getSheetConfig();
  return Number(sheet.getRange('B2').getValue()) || 150000;
}

function getDaftarBulan() {
  var sheet = getSheetTransaksi();
  var data = sheet.getDataRange().getValues();
  var bulanSet = new Set();
  
  // Ambil bulan dari data transaksi
  for (var i = 1; i < data.length; i++) {
    if (data[i][2]) {
      bulanSet.add(data[i][2].toString());
    }
  }
  
  // Pastikan bulan saat ini selalu ada di pilihan
  var today = new Date();
  var currentMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
  bulanSet.add(currentMonth);

  var listBulan = Array.from(bulanSet).sort().reverse();
  return { success: true, listBulan: listBulan, currentMonth: currentMonth };
}

function getDashboardData(targetBulan) {
  var sheet = getSheetTransaksi();
  var data = sheet.getDataRange().getValues();
  
  var today = new Date();
  var todayStr = today.toISOString().split('T')[0];
  var currentMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
  
  var selectedMonth = targetBulan || currentMonth;

  var saldoTotal = 0;
  var totalPemasukanBulanIni = 0;
  var totalPengeluaranBulanIni = 0;
  var totalPengeluaranHariIni = 0;
  var riwayatFiltered = [];

  // Rekap Data Pemasukan/Pengeluaran Bulanan untuk Grafik (6 Bulan Terakhir)
  var rekapBulananMap = {};

  for (var i = 1; i < data.length; i++) {
    var row = data[i];
    var tgl = row[1];
    var blnThn = row[2] ? row[2].toString() : '';
    var tipe = row[3];
    var ket = row[4];
    var jml = Number(row[5]) || 0;

    // Hitung Akumulasi Saldo Total Semua Waktu
    if (tipe === 'Pemasukan') saldoTotal += jml;
    if (tipe === 'Pengeluaran') saldoTotal -= jml;

    // Rekap Per Bulan untuk Grafik
    if (blnThn) {
      if (!rekapBulananMap[blnThn]) {
        rekapBulananMap[blnThn] = { pemasukan: 0, pengeluaran: 0 };
      }
      if (tipe === 'Pemasukan') rekapBulananMap[blnThn].pemasukan += jml;
      if (tipe === 'Pengeluaran') rekapBulananMap[blnThn].pengeluaran += jml;
    }

    // Filter Khusus Bulan yang Dipilih
    if (blnThn === selectedMonth) {
      if (tipe === 'Pemasukan') totalPemasukanBulanIni += jml;
      if (tipe === 'Pengeluaran') totalPengeluaranBulanIni += jml;

      riwayatFiltered.push({
        rowIndex: i + 1,
        tanggal: tgl,
        tipe: tipe,
        keterangan: ket,
        jumlah: jml
      });
    }

    // Filter Pengeluaran Hari Ini
    if (tgl === todayStr && tipe === 'Pengeluaran') {
      totalPengeluaranHariIni += jml;
    }
  }

  return {
    success: true,
    selectedMonth: selectedMonth,
    saldo: saldoTotal,
    totalPemasukan: totalPemasukanBulanIni,
    pengeluaranBulanIni: totalPengeluaranBulanIni,
    pengeluaranHariIni: totalPengeluaranHariIni,
    limitHarian: getLimitHarian(),
    riwayat: riwayatFiltered.reverse(),
    rekapBulanan: rekapBulananMap
  };
}

function simpanTransaksi(payload) {
  var sheet = getSheetTransaksi();
  var items = payload.items || [];
  var tglStr = payload.tanggal; // Format: YYYY-MM-DD
  var blnThn = tglStr.substring(0, 7); // Format: YYYY-MM

  items.forEach(function(item) {
    var id = 'TX-' + new Date().getTime() + '-' + Math.floor(Math.random() * 1000);
    sheet.appendRow([id, tglStr, blnThn, payload.tipe, item.keterangan, Number(item.jumlah)]);
  });

  return { success: true, message: 'Transaksi berhasil disimpan!' };
}

function hapusTransaksi(rowIndex) {
  var sheet = getSheetTransaksi();
  sheet.deleteRow(rowIndex);
  return { success: true, message: 'Transaksi berhasil dihapus!' };
}
